<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>nt</title>
  </head>
  <body>
    <main>
      <h1 id="CatalogPageTitle">AL Andalous catalogue</h1>
      <input
        type="search"
        id="search-input"
        placeholder="Rechercher des articles par titre..."
      />
      
        <h3 id="filter-title">Filtre</h3>
        <select id="status-filter">
          <option value="all">All statuses</option>
          <option value="available">Available</option>
          <option value="reserved">Reserved</option>
          <option value="sold">Sold</option>
        </select>
      
      <div id="trie-continer">
        <h3>Tri par(prix - titre - date) :</h3>
        <select id="sort-filter">
          <option value="default">Default order</option>
          <option value="title">Title (A-Z)</option>
          <option value="price-asc">Price (Low to High)</option>
          <option value="price-desc">Price (High to Low)</option>
          <option value="date">Date (Newest First)</option>
        </select>
      </div>
      <section id="articles-container" class="cards-grid"></section>
    </main>
    <script src="main.js" type="module"></script>
  </body>
</html>
