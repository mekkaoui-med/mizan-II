<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>nt</title>
  </head>
  <body>
    <main>
      <h1 id="CatalogPageTitle" >AL Andalous catalogue</h1>
      <button type="button" id="ajout-button">Ajouter Un Article (+)</button>
      <section id="form-section" class="hidden">
        <form id="ajout-form">
            <div class="box-inputs">

                <label for="article-title">ajoute title :</label>
                <p class=" hidden negative" id="titel-error">Un title entre 3 et 40 caractères</p>
                <input type="text" id="article-title" placeholder="ajoute un titre" class="ajoutInput">
            </div>
            <div class="box-inputs">
                <label for="article-description">ajoute description :</label>
                <p class=" hidden negative" id="description-error" >au moins 10 caractères</p>
                <input type="" id="article-description" placeholder="ajoute un description" class="ajoutInput">
            </div>
            <div class="box-inputs">
                <label for="article-price">ajout price :</label>
                <p class=" hidden negative" id="prix-error">un prix superieur a 0</p>
                <input type="number" id="article-price" placeholder="ajoute un price" class="ajoutInput">
            </div>
            <button type="submit" id="ajout-btn">Ajoute(+)</button>
        </form>
      </section>
      <p id="ajout-done" class="hidden ">Article ajouté avec succès</p>
      <input
        type="search"
        id="search-input"
        placeholder="Rechercher des articles par titre..."
      />
      
        <h3 id="filter-title">Filtre</h3>
        <select id="status-filter">
          <option value="all">All statuses</option>
          <option value="available">Available</option>
          <option value="reserved">Reserved</option>
          <option value="sold">Sold</option>
        </select>
      
      <div id="trie-continer">
        <h3>Tri par(prix - titre - date) :</h3>
        <select id="sort-filter">
          <option value="default">Default order</option>
          <option value="title">Title (A-Z)</option>
          <option value="price-asc">Price (Low to High)</option>
          <option value="price-desc">Price (High to Low)</option>
          <option value="date">Date (Newest First)</option>
        </select>
      </div>
      <section id="articles-container" class="cards-grid"></section>
    </main>
    <script src="main.js" type="module"></script>
  </body>
</html>
